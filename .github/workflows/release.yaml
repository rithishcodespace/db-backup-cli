name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: validate and build artifacts without pushing to registries'
        required: false
        type: boolean
        default: false
      publish_npm:
        description: 'Publish package to npm'
        required: false
        type: boolean
        default: true
      publish_docker:
        description: 'Build & push Docker image to Docker Hub'
        required: false
        type: boolean
        default: true
      create_github_release:
        description: 'Create GitHub release and attach artifacts'
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: 1. Validate & Test Release Candidate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (Strict Lockfile)
        run: npm ci

      - name: Install Dashboard dependencies
        run: npm --prefix dashboard ci

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript Compilation & Type Check
        run: npx tsc --noEmit

      - name: Build Project (Backend & Dashboard)
        run: npm run build:all

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Verify Release Package & Run Isolated Smoke Test
        run: node scripts/verify-package.js

      - name: Scan Tracked Files for Credential & Secret Leaks
        run: node scripts/scan-secrets.js

      - name: Extract Global Version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Global release version: ${VERSION}"

      - name: Package Release Tarball
        run: |
          mkdir -p dist-package
          npm pack --pack-destination dist-package

      - name: Upload Release Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbvault-release-tarball
          path: dist-package/*.tgz
          retention-days: 7

  publish-docker:
    name: 2. Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' || inputs.publish_docker == true
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: inputs.dry_run != true && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ inputs.dry_run != true && env.DOCKERHUB_TOKEN != '' }}
          tags: |
            rithish2006/db-backup:${{ needs.validate.outputs.version }}
            rithish2006/db-backup:latest

  publish-npm:
    name: 3. Publish to npm
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' || inputs.publish_npm == true
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Download release tarball
        uses: actions/download-artifact@v4
        with:
          name: dbvault-release-tarball
          path: dist-package

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Publish Package to npm
        if: inputs.dry_run != true && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish dist-package/*.tgz --access public

      - name: Dry-run Package Verification
        if: inputs.dry_run == true || env.NPM_TOKEN == ''
        run: |
          echo "Dry-run mode or NPM_TOKEN secret not set: skipping remote publication"
          ls -la dist-package/*.tgz

  create-github-release:
    name: 4. Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, publish-docker, publish-npm]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.publish-docker.result == 'success' || needs.publish-docker.result == 'skipped') &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') &&
      (github.event_name == 'push' || (inputs.create_github_release == true && inputs.dry_run != true))
    steps:
      - name: Download release tarball
        uses: actions/download-artifact@v4
        with:
          name: dbvault-release-tarball
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: Release v${{ needs.validate.outputs.version }}
          generate_release_notes: true
          files: release-artifacts/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
