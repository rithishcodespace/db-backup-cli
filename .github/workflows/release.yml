name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  CI: true
  DOCKER_ORG: rithishcodespace

jobs:
  validate-and-test:
    name: 1. Validate & Test Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check & Lint
        run: |
          npx tsc --noEmit
          npm run lint

      - name: Build All (Backend + Dashboard)
        run: npm run build:all

  publish-docker-hub:
    name: 2. Build & Push Multi-Arch Docker Images to Docker Hub
    runs-on: ubuntu-latest
    needs: validate-and-test
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != '' && env.DOCKERHUB_PASS != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Microservices Images
        if: env.DOCKERHUB_USER != '' && env.DOCKERHUB_PASS != ''
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          ORG="${{ env.DOCKER_ORG }}"

          echo "Building multi-architecture images for version ${VERSION}..."

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "${ORG}/db-backup-gateway:${VERSION}" \
            --tag "${ORG}/db-backup-gateway:latest" \
            --file Dockerfile \
            --push .

      - name: Skip Docker Hub push when secrets missing
        if: env.DOCKERHUB_USER == '' || env.DOCKERHUB_PASS == ''
        run: echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN missing. Skipping Docker Hub push."

  publish-npm:
    name: 3. Publish to NPM
    runs-on: ubuntu-latest
    needs: publish-docker-hub
    env:
      NPM_SECRET_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build full distribution artifacts
        run: npm run build:all

      - name: Verify package tarball
        run: npm pack --dry-run

      - name: Publish to npm
        if: env.NPM_SECRET_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Skip npm publish when NPM_TOKEN is missing
        if: env.NPM_SECRET_TOKEN == ''
        run: echo "NPM_TOKEN is not configured, skipping npm publish."

  create-github-release:
    name: 4. Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-npm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build full package
        run: npm run build:all

      - name: Create npm package tarball
        run: |
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts

      - name: Create GitHub Release with Artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*.tgz
