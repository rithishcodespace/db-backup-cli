name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node20-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node20-

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check (Backend)
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node20-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node20-

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Discover and run unit tests
        shell: bash
        run: |
          mapfile -t TEST_FILES < <(
            find tests src \
              -type f \
              \( -name '*.test.ts' -o -name '*.spec.ts' -o -name '*.test.js' -o -name '*.spec.js' \) \
              2>/dev/null
          )

          if (( ${#TEST_FILES[@]} == 0 )); then
            echo "No dedicated unit test files found."
            exit 0
          fi

          node --test -r ts-node/register "${TEST_FILES[@]}"

  integration-tests:
    name: Microservices & Database Integration Tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: rithish
          POSTGRES_PASSWORD: 'Rithish@2006'
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rithish -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongo:
        image: mongo:6
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node20-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node20-

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build All (Backend + React Dashboard)
        run: npm run build:all

      - name: Start microservices
        run: npm run services:start

      - name: Wait for microservices health endpoints
        shell: bash
        run: |
          set -euo pipefail

          endpoints=(
            http://localhost:3000/health
            http://localhost:3001/health
            http://localhost:3010/health
            http://localhost:3011/health
            http://localhost:3012/health
            http://localhost:3013/health
            http://localhost:3020/health
            http://localhost:3030/health
            http://localhost:3040/health
          )

          for endpoint in "${endpoints[@]}"; do
            echo "Waiting for ${endpoint}..."
            ready=false
            for attempt in {1..30}; do
              if curl --fail --silent --show-error "$endpoint" >/dev/null; then
                ready=true
                break
              fi
              sleep 3
            done

            if [[ "$ready" != true ]]; then
              echo "Service did not become ready: ${endpoint}"
              exit 1
            fi
          done

      - name: Run service integration checks
        run: npm run test:services

      - name: Stop microservices
        if: always()
        run: npm run services:stop
