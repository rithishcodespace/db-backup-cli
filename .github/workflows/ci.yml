name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  validate:
    name: Validate Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node${{ matrix.node-version }}-

      - name: Install dependencies (Strict Lockfile)
        shell: bash
        run: npm ci

      - name: Install Dashboard dependencies
        shell: bash
        run: npm --prefix dashboard ci

      - name: Dependency Security Audit
        shell: bash
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        shell: bash
        run: npx prisma generate

      - name: TypeScript Compilation & Type Check
        shell: bash
        run: npx tsc --noEmit

      - name: Build Project (Backend & Dashboard)
        shell: bash
        run: npm run build:all

      - name: Run Unit Tests
        shell: bash
        run: npm run test:unit

      - name: Verify Release Package & Run Isolated Smoke Test
        shell: bash
        run: node scripts/verify-package.js

      - name: Scan Tracked Files for Credential & Secret Leaks
        shell: bash
        run: node scripts/scan-secrets.js
