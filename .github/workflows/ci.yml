name: CI

on:
  # push:
  #   branches:
  #     - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Type check and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node20-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node20-

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node20-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node20-

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-cli-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node20-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node20-

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Discover unit tests
        id: discover
        shell: bash
        run: | # It stores all matching file names into a Bash array.
          mapfile -t TEST_FILES < <(
            find tests src \
              -type f \
              \( -name '*.test.ts' -o -name '*.spec.ts' -o -name '*.test.js' -o -name '*.spec.js' \) \
              2>/dev/null
          )

          if (( ${#TEST_FILES[@]} == 0 )); then
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No dedicated unit test files were found; skipping this job."
            exit 0
          fi

          printf '%s\n' "${TEST_FILES[@]}" > unit-test-files.txt
          echo "has_tests=true" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        if: steps.discover.outputs.has_tests == 'true'
        shell: bash
        run: node --test -r ts-node/register $(tr '\n' ' ' < unit-test-files.txt)

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: rithish
          POSTGRES_PASSWORD: 'Rithish@2006'
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rithish -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongo:
        image: mongo:6
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node20-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node20-

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Start microservices
        run: npm run services:start

      - name: Wait for service readiness
        shell: bash
        run: |
          set -euo pipefail

          endpoints=(
            http://localhost:3000/health
            http://localhost:3001/health
            http://localhost:3010/health
            http://localhost:3011/health
            http://localhost:3012/health
            http://localhost:3013/health
            http://localhost:3020/health
            http://localhost:3030/health
            http://localhost:3040/health
          )

          for endpoint in "${endpoints[@]}"; do
            echo "Waiting for ${endpoint}"
            ready=false
            for attempt in {1..30}; do
              if curl --fail --silent --show-error "$endpoint" >/dev/null; then
                ready=true
                break
              fi
              sleep 5
            done

            if [[ "$ready" != true ]]; then
              echo "Service did not become ready: ${endpoint}"
              exit 1
            fi
          done

      - name: Run service integration checks
        run: npm run test:services

      - name: Run phase 4 integration checks
        run: npm run test:phase4

      - name: Stop microservices
        if: always()
        run: npm run services:stop
